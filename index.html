<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <!-- Makes the app open full screen when added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Five">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Five</title>
</head>
<body>

  <!-- Screen 1: game setup -->
  <section id="setup" class="screen">
    <h1 class="logo">Five<span>.</span></h1>
    <p class="subtitle">Compteur de points</p>

    <div class="card">
      <div class="row">
        <label>Joueurs</label>
        <div class="stepper">
          <button type="button" id="minus-player" aria-label="Retirer un joueur">−</button>
          <span id="player-count">3</span>
          <button type="button" id="plus-player" aria-label="Ajouter un joueur">+</button>
        </div>
      </div>
      <div id="name-inputs"></div>
    </div>

    <div class="card">
      <label>Score maximum</label>
      <div class="segmented" id="max-choices">
        <button type="button" data-max="50">50</button>
        <button type="button" data-max="100" class="active">100</button>
        <button type="button" data-max="150">150</button>
        <button type="button" data-max="200">200</button>
      </div>
    </div>

    <button type="button" class="primary" id="start">Commencer</button>
  </section>

  <!-- Screen 2: scoreboard -->
  <section id="game" class="screen hidden">
    <header class="topbar">
      <button type="button" class="ghost" id="new-game">Nouvelle partie</button>
      <div class="info" id="game-info"></div>
    </header>

    <ul id="scoreboard"></ul>

    <div class="actions">
      <button type="button" class="primary" id="open-round">+ Nouvelle manche</button>
      <div class="secondary-actions">
        <button type="button" class="ghost" id="undo">Annuler la dernière manche</button>
        <button type="button" class="ghost" id="toggle-history">Historique</button>
      </div>
    </div>

    <div id="history" class="card hidden"></div>
  </section>

  <!-- Bottom sheet: enter points for one round -->
  <div id="round-sheet" class="overlay hidden">
    <div class="sheet">
      <div class="sheet-header">
        <button type="button" class="ghost" id="cancel-round">Annuler</button>
        <h2 id="round-title">Manche</h2>
        <button type="button" class="ghost accent" id="save-round">Valider</button>
      </div>
      <div id="round-inputs"></div>
    </div>
  </div>

  <!-- Winner popup -->
  <div id="winner" class="overlay center hidden">
    <div class="winner-card">
      <div class="trophy">🏆</div>
      <h2 id="winner-name"></h2>
      <p>a gagné la partie</p>
      <button type="button" class="primary" id="replay">Rejouer avec les mêmes joueurs</button>
      <button type="button" class="ghost" id="winner-new">Nouvelle partie</button>
      <button type="button" class="ghost" id="winner-close">Voir les scores</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
